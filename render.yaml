databases:
  - name: spanish-app-db
    plan: free

services:
  - type: web
    name: spanish-app-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: spanish_app_key
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: spanish-app-db
          property: connectionString

  - type: web
    name: spanish-app-front
    env: static
    buildCommand: cd spanish-react-app && npm install && npm run build
    staticPublishPath: spanish-react-app/dist
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: VITE_API_URL
        value: https://spanish-app-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
